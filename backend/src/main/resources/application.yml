server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:h2:file:./data/os_qa;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  mail:
    host: smtp.qq.com
    port: 587
    username: your_email@qq.com
    password: your_smtp_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: os-qa-assistant-xidian-university-2024-secret-key-for-jwt-token-generation
  expiration: 86400000

langchain4j:
  deepseek:
    api-key: ${LANGCHAIN4J_DEEPSEEK_API_KEY:your_deepseek_api_key}
    model-name: deepseek-chat
    base-url: https://api.deepseek.com
  chroma:
    url: http://localhost:8000
    collection-name: os_textbook

knowledge:
  upload-dir: ${user.dir}/uploads/knowledge
  chunk-size: 1000
  chunk-overlap: 200

web:
  search:
    enabled: true
    subject: 操作系统

sms:
  dev-mode: true
  # 开发模式：true=返回验证码到前端(方便测试)，false=需接入真实短信服务

logging:
  level:
    com.xidian.osqa: debug
