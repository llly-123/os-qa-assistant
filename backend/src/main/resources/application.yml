server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/os_qa?useUnicode=true&characterEncoding=utf8&connectionTimeZone=GMT%2B8&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:os-qa-assistant-xidian-university-2024-secret-key-for-jwt-token-generation}
  expiration: 86400000

app:
  # 敏感字段（API Key、短信密钥等）数据库加密密钥。生产必须通过 APP_ENCRYPT_KEY 环境变量注入，
  # 留空则使用内置开发密钥（仅用于本地开发，勿用于生产）。
  encrypt-key: ${APP_ENCRYPT_KEY:}

langchain4j:
  chroma:
    url: http://localhost:8000
    collection-name: os_textbook

knowledge:
  upload-dir: ${user.dir}/uploads/knowledge
  chunk-size: 1000
  chunk-overlap: 200

web:
  search:
    enabled: true
    subject: 操作系统

video:
  upload-dir: ${user.dir}/uploads/videos
  max-size: 524288000

logging:
  level:
    com.xidian.osqa: debug
    org.springframework.web.context.request.async: error
